[project]
name = "limite-evals-core"
version = "0.1.0"
description = "Answer extraction, math equivalence, result schema, and confidence intervals for Limite evals"
requires-python = "~=3.12.0"
# Deliberately minimal and deliberately without `verifiers`, so scoring,
# comparison, and report tooling remain independently usable without the GPU
# serving stack. Nothing here may import torch, vllm, or verifiers.
dependencies = [
    "latex2sympy2-extended==1.11.0",
    "loguru>=0.7.3",
    "math-verify==0.9.0",
    "pydantic>=2.12",
    "pylatexenc>=2.11",
    "regex>=2026.7.19",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limite_evals_core"]

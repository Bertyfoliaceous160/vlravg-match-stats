[project]
name = "olmo-hybrid-vllm-plugin"
version = "0.1.0"
description = "vLLM 0.28.0 OLMo Hybrid GDN convolution loader compatibility patch"
requires-python = "~=3.12.0"
# vLLM and torch are supplied by the umbrella workspace. Keeping this empty
# prevents a second resolver path from changing the engine behind a score.
dependencies = []

[project.entry-points."vllm.general_plugins"]
olmo-hybrid-gdn-shards = "olmo_hybrid_vllm.register:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olmo_hybrid_vllm"]
